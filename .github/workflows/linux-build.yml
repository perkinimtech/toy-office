name: TOY Office Linux Build

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - '.gitmodules'
      - 'scripts/**'
      - 'package*.json'
      - '.gitmodules'
      - '.github/workflows/linux-build.yml'

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf python3-pip rsync bc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install npm dependencies
        run: npm ci
      - name: Build sdkjs development scripts
        run: |
          cd src/sdkjs/build
          npm ci
          npx grunt develop --desktop=true
      - name: Prepare fonts
        run: |
          pip3 install Pillow --quiet
          bash scripts/prepare-fonts.sh
      - name: Prepare icons
        run: |
          mkdir -p src-tauri/icons
          # Build-safe fallback: keep packaging independent from launcher artwork.
          curl -L --fail --silent --show-error \
            -o src-tauri/icons/icon.ico \
            https://raw.githubusercontent.com/delmarguillen/euro-office-lite/8171534ed2f9f3862d85d3f0d0d68b0db0d6440d/src-tauri/icons/icon.ico
          bash scripts/generate-icons.sh

      - name: Get x2t
        run: bash scripts/get-x2t-ci.sh x86_64-unknown-linux-gnu
        env:
          GITHUB_REPOSITORY: delmarguillen/euro-office-lite
          GH_TOKEN: ${{ github.token }}
      - name: Stage frontend
        run: bash scripts/prepare-dist.sh
      - name: Verify staged TOY frontend
        run: |
          set -euo pipefail
          grep -q '<title>TOY Office</title>' src-dist/index.html
          grep -q 'PERKİN İMtech. A.Ş.' src-dist/index.html
          grep -q 'PDF / Dosya Aç' src-dist/index.html
          grep -q "GetEditorId: () => 'toy-office'" src-dist/bridge.js
          grep -q "LocalFileCreate" src-dist/bridge.js
          ! grep -q 'Euro Office Lite' src-dist/index.html
          echo "Verified staged TOY frontend."

      - name: Build .deb
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles deb

      - name: Verify built package contents
        run: |
          set -euo pipefail
          DEB=$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$DEB"
          mkdir -p /tmp/toy-deb
          dpkg-deb -x "$DEB" /tmp/toy-deb
          echo "Built package: $DEB"
          find /tmp/toy-deb -maxdepth 5 -type f | sort | head -200
          strings src-tauri/target/x86_64-unknown-linux-gnu/release/toy-office | grep -q 'TOY Office'
          strings src-tauri/target/x86_64-unknown-linux-gnu/release/toy-office | grep -q 'PERKİN İMtech. A.Ş.'
          strings src-tauri/target/x86_64-unknown-linux-gnu/release/toy-office | grep -q 'PDF / Dosya Aç'
          strings src-tauri/target/x86_64-unknown-linux-gnu/release/toy-office | grep -q 'toy-office'
          echo "Verified TOY markers inside compiled binary."
      - name: Smoke test installed package
        run: |
          sudo apt-get install -y xvfb
          DEB=$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$DEB"
          DEB=$(readlink -f "$DEB")
          echo "Testing package: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture
          sudo apt-get install -y "$DEB"
          command -v toy-office
          set +e
          timeout 20s xvfb-run -a toy-office > /tmp/toy-office-launch.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 124 ]; then
            cat /tmp/toy-office-launch.log
            exit "$RC"
          fi
          echo "TOY Office package installed and application stayed alive under Xvfb."
      - uses: actions/upload-artifact@v4
        with:
          name: toy-office-0.1.0-alpha-linux-amd64
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
