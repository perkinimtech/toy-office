<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOY Office</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: grid;
      place-items: center;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 2.4rem; font-weight: 500; margin-bottom: .5rem; }
    p { color: #a6adc8; }
    .actions { display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; margin-top:2rem; }
    button { padding:.85rem 1.2rem; border-radius:8px; border:1px solid #45475a; background:#313244; color:#cdd6f4; }
  </style>
</head>
<body>
  <main>
    <h1>TOY Office</h1>
    <p>0.1.0-alpha · PERKİN İMtech. A.Ş.</p>
    <div class="actions">
      <button>Belge</button>
      <button>Hesap Tablosu</button>
      <button>Sunum</button>
      <button>Dosya Aç</button>
    </div>
  </main>
</body>
</html>
